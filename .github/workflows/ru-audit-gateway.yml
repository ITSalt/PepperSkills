name: RU gateway network acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/ru-audit-gateway/**'
      - 'plugins/pepper-ru-web-compliance/**'
      - '.github/workflows/ru-audit-gateway.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go tests, races and vet
        run: docker run --rm -v "$PWD/services/ru-audit-gateway:/src" -w /src golang:1.26-bookworm sh -c 'go test -race ./... && go vet ./...'
      - name: Container filter independent of application checks
        run: bash services/ru-audit-gateway/test-firewall.sh
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install h11==0.16.0 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Local TLS proxy and third-party browser resources
        run: python plugins/pepper-ru-web-compliance/skills/pepper-ru-web-compliance/scripts/test_gateway_network.py --browser
      - name: Real collector consent, refusal and revisit through TLS bridge
        run: python plugins/pepper-ru-web-compliance/skills/pepper-ru-web-compliance/scripts/test_browser_scenarios.py --out /tmp/pepper-browser-qa
