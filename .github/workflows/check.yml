name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Process concurrency, recovery, instructions and client adapters
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python plugins/pepper-orchestrator/skills/pepper-orchestrator/scripts/runtime_selftest.py
      - name: Install native Windows Codex CLI for transport acceptance
        if: runner.os == 'Windows'
        run: npm install --global @openai/codex@0.154.0
      - name: Distributed archive, PowerShell launch and native App Server
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-orchestrator-windows.ps1

  ubuntu-py310:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'
      - name: Prepare test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          python -m pip install --disable-pip-version-check -r scripts/requirements-build.txt
      - name: Offline test suite and package checks
        run: bash scripts/check.sh
      - id: hashes
        name: Record package hashes
        run: echo "value<<EOF" >> "$GITHUB_OUTPUT"; python scripts/archive-hashes.py >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

  ubuntu-py312:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Prepare test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          python -m pip install --disable-pip-version-check -r scripts/requirements-build.txt
      - name: Offline test suite and package checks
        run: bash scripts/check.sh
      - id: hashes
        name: Record package hashes
        run: echo "value<<EOF" >> "$GITHUB_OUTPUT"; python scripts/archive-hashes.py >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

  macos-py312:
    runs-on: macos-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Prepare test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-build.txt
      - name: Offline test suite and package checks
        run: bash scripts/check.sh
      - id: hashes
        name: Record package hashes
        run: echo "value<<EOF" >> "$GITHUB_OUTPUT"; python scripts/archive-hashes.py >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

  compare-packages:
    runs-on: ubuntu-latest
    needs: [ubuntu-py310, ubuntu-py312, macos-py312]
    steps:
      - name: Compare package hashes across platforms and Python versions
        env:
          UBUNTU_310: ${{ needs.ubuntu-py310.outputs.hashes }}
          UBUNTU_312: ${{ needs.ubuntu-py312.outputs.hashes }}
          MACOS_312: ${{ needs.macos-py312.outputs.hashes }}
        run: |
          test -n "$UBUNTU_310"
          test "$UBUNTU_310" = "$UBUNTU_312"
          test "$UBUNTU_310" = "$MACOS_312"
