# Overlay for the shared 2-vCPU VPS. The native TLS listener keeps client IPs.
services:
  gateway:
    image: pepper-ru-audit-gateway:2.4.0
    cpus: 1
    environment:
      TRUSTED_V2_PROXY_IP: 10.240.81.1
    ports: !override
      - "77.247.243.9:8443:8443"
      - "127.0.0.1:18443:8080"
networks:
  default:
    ipam:
      config: [{subnet: 10.240.81.0/24}]
