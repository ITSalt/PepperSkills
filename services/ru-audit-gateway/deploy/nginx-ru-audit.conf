# Insert in the existing lts.itsalt.ru TLS server on port 443.
# nginx normalizes the prefix before forwarding to the internal v2 listener.
location = /ru-audit { return 308 /ru-audit/; }
location ^~ /ru-audit/ {
    proxy_pass http://127.0.0.1:18443/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Pepper-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    client_max_body_size 80k;
}
