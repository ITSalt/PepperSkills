# Program configuration for the pepper-orchestrator workspace.
# Read by orch.py (YAML subset: block maps and lists, flow [..] and {..}, scalars).

# Prefix of session names and messages.
program: {{PROGRAM}}
# active | closed: `close --apply` closes the program (one program, one goal), `reopen` reopens it.
state: active
# Session kind of module sessions, the owner's explicit choice at init: local (recommended) | cloud.
# Repositories and modules inherit it; a module may set its own `sessions` after an owner decision.
sessions: local
# Permission mode of the program's sessions, the owner's explicit choice at init: auto (recommended) |
# acceptEdits | default | dontAsk | bypassPermissions. dispatch passes it with --permission-mode.
permission_mode: {{PERMISSION_MODE}}
# Owner checkpoints: actions that always ask the owner in the session window (permissions.ask),
# even in auto mode: push (every git push asks) | pr (gh pr create) | deploy_test (the
# module's deploy_test command; pushes too where every push deploys the stand).
checkpoints: [deploy_test]
title: {{PROGRAM_TITLE_YAML}}
# [{{TAG}}] in messages and PR titles.
tag: {{TAG}}
# Language of owner-facing documents: en | ru.
owner_language: {{LANG}}
coordinator_session: {{COORDINATOR}}
# true: orch.py commit also pushes (the owner reads from another device).
push_after_milestone: false
# Where the workspace lives: separate (its own home repository) | in-repo (branch orch/<program>
# of a module repository, in a directory every push workflow ignores; init --in-repo sets
# workspace_branch and workspace_dir). State commits go only to workspace_branch.
# deploy_check_override: D-n is written only when the owner accepted an unverifiable deploy check.
workspace_mode: separate

# Implementer models (recommendation per package; the owner may change it before starting):
# aliases sonnet | opus | fable | haiku | opusplan or a full claude-... id; effort low | medium |
# high | xhigh | max. Without `models`, start commands carry no model flags (the owner's default).
# models:
#   implement: sonnet
#   escalate: opus
#   escalate_effort: high

# Repositories shared by several modules (streams). One writing session per worktree and branch.
repos: []
# Example repository:
#  - id: mono
#    path: ~/projects/example-monorepo
#    base: main
#    branch_prefix: feature/          # the repository's own convention
#    worktree_root: .claude/worktrees # where `claude -w` puts worktrees
#    worktree_setup: ["pnpm install --frozen-lockfile"]   # installs and generation only; secrets: .worktreeinclude
#    merge_policy: sequential         # sequential | free
#    shared_paths: [pnpm-lock.yaml, "**/package.json", "backend/migrations/**"]
#    resources: [staging, migrations, {name: ci-gate, mode: on-demand}]   # on-demand: LOCK/UNLOCK messages
#    checks: ["./scripts/check-migration-order.sh"]   # read-only commands; see below
#    review_setup: ["cp \"$ORCH_MAIN_CHECKOUT/.env\" .env", "pnpm install --frozen-lockfile"]  # review clones
#    deploy_workflows: [deploy.yml]   # read by resume to see who holds the stand
#    base_deploys: prod               # prod | staging | none: what a merge into base deploys
#    sessions: cloud                  # local | cloud: module sessions are cloud sessions (own clones)
#    cloud_environment: Project env   # name of the owner's cloud environment (never variable values)
#    push_deploys: true               # a push of any branch deploys the stand: sessions push only with the stand slot
#
# Paths are globs: `*` (one directory), `**` (any depth), `?` (one character), `{a,b}`
# (alternatives); `[` and `]` are literal.
# worktree_setup: commands a session runs in its new worktree - dependency installs and code generation
# only. Never copy .env files, secret/key/cert directories or .claude/ there: list the gitignored files
# in `.worktreeinclude` in the repository root (Claude Code copies them into every new worktree), and
# `.claude/settings.local.json` is read from the main checkout by every worktree.
# resources: a name is held by a package from dispatch until merge or verification (mode package);
# {name: <n>, mode: on-demand} is taken only when the session sends LOCK <n> (orch.py lock acquire)
# and given back on UNLOCK or READY.
# checks: run by `orch.py overlap` and `orch.py review-start` through the shell in the repository's main checkout, env
# ORCH_BASE_REF (base ref) and ORCH_BRANCHES (active package branches, space separated), timeout
# 300 s; a non-zero exit is a finding. Checks must only read.

# Modules: a whole repository (kind: repo, `repo: <path>`) or an area/domain of a repos entry.
modules: []
# Example module that is a whole repository:
#  - id: db
#    repo: ~/projects/example-database
#    base: main
#    session: {{PROGRAM}}-db
#    tests: ["./scripts/test.sh"]
#    deploy_test: owner-confirmed in module window
#    deploy_prod: ./scripts/deploy.sh --target prod
#    release_clone: ~/projects/example-database-release
#    web_urls: {test: https://test.example.com, prod: https://example.com}
# Example module that is an area of a shared repository:
#  - id: admin
#    kind: area                       # area | domain | repo
#    repo: mono
#    paths: ["apps/admin/**"]
#    session: {{PROGRAM}}-admin
#    test_db: example_test_admin
#    ports: {app: 3120}
#    tests: {scoped: ["pnpm --filter admin test"], full: ["pnpm -r test"]}
#    methodology: {name: nacl, allowed: [nacl-tl-fix, nacl-tl-ship], forbidden: [nacl-tl-release, nacl-tl-deploy]}
#    model: opus                      # overrides models.implement for this module
#    effort: high

environments: {}
guards: {}
# Optional source of facts: none | nacl. Tasks and statuses always stay in files.
spec_graph: none
# Live checks: playwright | none.
e2e: none
