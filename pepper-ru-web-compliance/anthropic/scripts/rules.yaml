# --- ГРУППА C. Персональные данные (152-ФЗ) ----------------------------------
# Размеры санкций — в редакции ФЗ от 30.11.2024 № 420-ФЗ (в силе с 30.05.2025).
# Нумерация новых частей ст. 13.11 в открытых источниках расходится —
# перед юридическим применением сверять с действующим текстом на pravo.gov.ru.

  - id: PDN-001
    group: pdn
    title: Политика обработки персональных данных опубликована
    requirement: >-
      Оператор обязан опубликовать документ, определяющий политику обработки
      персональных данных, и обеспечить неограниченный доступ к нему.
    norm:
      act: "ч. 2 ст. 18.1 ФЗ от 27.07.2006 № 152-ФЗ"
    liability:
      article: "ч. 3 ст. 13.11 КоАП РФ"
      fines:
        citizen: "1 500 – 3 000 ₽"
        official: "6 000 – 12 000 ₽"
        entrepreneur: "10 000 – 20 000 ₽"
        legal_entity: "30 000 – 60 000 ₽"
    check: script
    detector: documents
    evidence:
      - "HTTP-статус и итоговый URL страницы политики"
      - "Доступность без авторизации"
    status_logic:
      PASS: "Страница политики найдена и отдаёт 200 без авторизации"
      FAIL: "Страница не найдена либо недоступна"
    fix_hint: "Опубликовать политику по постоянному URL, доступному без входа."
    severity: medium
    verified_at: "2026-09-14"

  - id: PDN-002
    group: pdn
    title: Доступ к политике со страниц сбора персональных данных
    requirement: >-
      Оператор обязан обеспечить неограниченный доступ к политике. Значение
      имеет страница, на которой данные собираются: с неё пользователь должен
      дойти до политики до отправки формы. Ссылки на каждой странице сайта
      норма не требует — на практике её ставят в футер, и этого достаточно.
    norm:
      act: "ч. 2 ст. 18.1 ФЗ-152"
    liability:
      article: "ч. 3 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "30 000 – 60 000 ₽"
    check: script
    detector: documents
    evidence:
      - "Перечень страниц с формами сбора ПДн и отметкой наличия ссылки"
    status_logic:
      PASS: "На всех страницах со сбором данных есть доступ к политике"
      FAIL: "Хотя бы на одной странице со сбором данных доступа к политике нет"
      NA: "Форм сбора персональных данных на обойдённых страницах нет"
    manual_check: >-
      Открыть каждую страницу с формой (заявка, подписка, регистрация, обратная
      связь) и убедиться, что ссылка на политику доступна с неё без прокрутки в
      другой раздел — обычно в футере или в подписи чекбокса согласия.
    severity: low
    verified_at: "2026-09-14"

  - id: PDN-003
    group: pdn
    title: Полнота политики обработки персональных данных
    requirement: >-
      Политика должна раскрывать: цели обработки по каждой категории, правовые
      основания, категории субъектов и персональных данных, перечень действий и
      способы обработки, сроки хранения и порядок уничтожения, права субъекта и
      порядок их реализации, контакты ответственного за организацию обработки,
      сведения о трансграничной передаче с перечнем стран, раздел о cookie,
      сведения о поручении обработки третьим лицам.
    norm:
      act: "ч. 2 ст. 18.1 и ст. 14 ФЗ-152"
    liability:
      article: "ч. 3 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "30 000 – 60 000 ₽"
      note: "По практике РКН неполная политика приравнивается к отсутствующей"
    check: llm
    evidence:
      - "Цитата из текста политики на каждый подтверждённый пункт"
      - "Явное указание отсутствующих пунктов"
    status_logic:
      PASS: "Все обязательные пункты раскрыты"
      FAIL: "Отсутствует хотя бы один обязательный пункт"
    fix_hint: "Дописать недостающие разделы; не использовать шаблон без адаптации под фактическую обработку."
    manual_check: >-
      Сверить политику с перечнем обязательных сведений ч. 2 ст. 18.1 и ст. 14
      ФЗ-152: по каждому пункту либо цитата из документа, либо отметка, что его
      нет.
    severity: medium
    verified_at: "2026-09-14"

  - id: PDN-004
    group: pdn
    title: Чекбокс согласия в каждой форме сбора персональных данных
    requirement: >-
      Согласие должно быть конкретным, предметным, информированным, сознательным
      и однозначным. Форма сбора данных без отдельного чекбокса согласия не
      обеспечивает доказуемости согласия.
    norm:
      act: "ч. 1 и ч. 4 ст. 9 ФЗ-152"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        citizen: "10 000 – 15 000 ₽"
        official: "100 000 – 300 000 ₽"
        legal_entity: "300 000 – 700 000 ₽"
      repeat_offence:
        article: "ч. 2.1 ст. 13.11 КоАП РФ"
        entrepreneur: "500 000 – 1 000 000 ₽"
        legal_entity: "1 000 000 – 1 500 000 ₽"
    check: script
    detector: forms_consent
    evidence:
      - "Селектор формы, перечень её полей"
      - "Наличие или отсутствие input[type=checkbox] в форме"
    status_logic:
      PASS: "Во всех формах сбора ПДн есть чекбокс согласия"
      FAIL: "Хотя бы в одной форме чекбокса нет"
      NA:   "Форм сбора персональных данных не обнаружено"
    severity: high
    verified_at: "2026-09-14"

  - id: PDN-005
    group: pdn
    title: Чекбокс согласия не отмечен по умолчанию
    requirement: >-
      Предварительно проставленная галочка не является выражением воли субъекта:
      согласие должно быть активным действием.
    norm:
      act: "ч. 1 ст. 9 ФЗ-152"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "300 000 – 700 000 ₽"
    check: script
    detector: forms_consent
    evidence:
      - "Атрибут checked в разметке либо checked=true в отрендеренном DOM"
      - "Значение defaultChecked в JSX или :checked в шаблоне Vue при white-box режиме"
    status_logic:
      PASS: "Ни один чекбокс согласия не отмечен по умолчанию"
      FAIL: "Найден предотмеченный чекбокс"
    fix_hint: "Снять атрибут checked; проверить и разметку, и начальное состояние в компоненте."
    severity: high
    note: >-
      Проверять именно отрендеренный DOM: состояние часто задаётся скриптом уже
      после загрузки, в статическом HTML атрибута может не быть.
    verified_at: "2026-09-14"

  - id: PDN-006
    group: pdn
    title: Активная ссылка на политику в подписи чекбокса
    requirement: >-
      Субъект должен иметь возможность ознакомиться с политикой непосредственно
      в момент дачи согласия. Упоминание политики простым текстом этого не обеспечивает.
    norm:
      act: "ч. 4 ст. 9 ФЗ-152"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "300 000 – 700 000 ₽"
    check: script
    detector: forms_consent
    evidence:
      - "Наличие тега a[href] внутри label чекбокса и целевой URL"
    status_logic:
      PASS: "В подписи каждого чекбокса есть рабочая ссылка на политику"
      FAIL: "Ссылки нет либо она ведёт на 404"
    severity: medium
    verified_at: "2026-09-14"

  - id: PDN-007
    group: pdn
    title: Отдельное согласие на рекламную рассылку
    requirement: >-
      Согласие на обработку персональных данных и согласие на получение рекламы —
      разные согласия. Пакетное согласие одним чекбоксом недопустимо.
    norm:
      act: "ст. 9 ФЗ-152; ч. 1 ст. 18 ФЗ-38 «О рекламе»"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ и ч. 1 ст. 14.3 КоАП РФ"
      fines:
        legal_entity: "300 000 – 1 000 000 ₽ совокупно"
    check: hybrid
    detector: forms_consent
    evidence:
      - "Количество чекбоксов в форме"
      - "Текст подписи каждого чекбокса"
    status_logic:
      PASS: "Согласия разделены либо рекламной рассылки нет"
      FAIL: "Один чекбокс покрывает и обработку ПДн, и рекламную рассылку"
      WARN: "Чекбокс один, признаков рекламной цели не обнаружено — требуется подтверждение LLM"
    severity: high
    verified_at: "2026-09-14"

  - id: PDN-008
    group: pdn
    title: Содержание текста согласия
    requirement: >-
      Согласие должно содержать конкретную цель, идентификацию оператора
      (наименование и адрес), перечень персональных данных и действий с ними,
      срок действия и порядок отзыва.
    norm:
      act: "ч. 4 ст. 9 ФЗ-152"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "300 000 – 700 000 ₽"
    check: llm
    evidence:
      - "Полный текст подписи чекбокса либо отдельного документа согласия"
      - "Цитата на каждый подтверждённый и каждый отсутствующий элемент"
    status_logic:
      PASS: "Все обязательные элементы присутствуют"
      FAIL: "Отсутствует хотя бы один элемент либо цель сформулирована общей фразой"
    fix_hint: >-
      Заменить формулировки вида «в маркетинговых целях» на конкретный перечень
      целей; добавить порядок отзыва согласия.
    manual_check: >-
      Прочитать текст согласия: перечислены ли конкретные цели вместо
      формулировки «в маркетинговых целях», указаны ли состав данных, срок
      действия и порядок отзыва.
    severity: high
    verified_at: "2026-09-14"

  - id: PDN-009
    group: pdn
    title: Отдельное согласие на трансграничную передачу
    requirement: >-
      Трансграничная передача требует отдельного согласия и предварительного
      уведомления Роскомнадзора о намерении осуществлять такую передачу.
    norm:
      act: "ст. 12 ФЗ-152"
    liability:
      article: "ст. 13.11 КоАП РФ (нарушение порядка трансграничной передачи)"
      fines:
        official: "100 000 – 400 000 ₽"
        legal_entity: "1 000 000 – 6 000 000 ₽"
    check: hybrid
    detector: trackers_jurisdiction
    evidence:
      - "Перечень доменов-получателей данных с определённой юрисдикцией"
      - "Наличие или отсутствие отдельного согласия в формах"
    status_logic:
      FAIL: "Данные уходят в иностранную юрисдикцию, отдельного согласия нет"
      WARN: "Иностранные эндпоинты найдены, но передача персональных данных не доказана"
      PASS: "Иностранных получателей нет либо согласие получено корректно"
    severity: critical
    verified_at: "2026-09-14"

  - id: PDN-010
    group: pdn
    title: Уведомление Роскомнадзора об обработке персональных данных
    requirement: >-
      Оператор обязан уведомить Роскомнадзор о намерении осуществлять обработку
      персональных данных. Исключений для сайтов нет.
    norm:
      act: "ст. 22 ФЗ-152"
    liability:
      article: "ч. 10 ст. 13.11 КоАП РФ"
      in_force: "2025-05-30"
      fines:
        citizen: "5 000 – 10 000 ₽"
        official: "30 000 – 50 000 ₽"
        legal_entity: "100 000 – 300 000 ₽"
    check: script
    detector: rkn_operator_registry
    registry: rkn_pd_operators
    evidence:
      - "ИНН или ОГРН, извлечённые с сайта"
      - "Результат поиска в реестре операторов ПДн с URL карточки"
    status_logic:
      PASS: "Оператор найден в реестре"
      FAIL: "Оператор в реестре не найден при наличии форм сбора данных"
      UNKNOWN: "ИНН на сайте не найден либо реестр недоступен"
    depends_on: ["ORG-001"]
    manual_check: >-
      Открыть https://pd.rkn.gov.ru/operators-registry/operators-list/ и ввести
      ИНН оператора в поле «ИНН» и нажать «Найти». Если записи нет — уведомление
      об обработке персональных данных в Роскомнадзор не подавалось. ИНН берётся
      из раздела «Реквизиты оператора» настоящей записки или у владельца сайта.
    severity: medium
    note: "Официального API у реестра нет — только HTML-поиск по pd.rkn.gov.ru."
    verified_at: "2026-09-14"

  - id: PDN-011
    group: pdn
    title: Локализация базы данных на территории РФ
    requirement: >-
      Запись, систематизация, накопление и хранение персональных данных граждан
      РФ при их сборе должны осуществляться с использованием баз данных,
      находящихся на территории РФ.
    norm:
      act: "ч. 5 ст. 18 ФЗ-152 (в ред., действующей с 01.07.2025)"
    liability:
      article: "ч. 8 ст. 13.11 КоАП РФ"
      fines:
        citizen: "30 000 – 50 000 ₽"
        official: "100 000 – 200 000 ₽"
        legal_entity: "1 000 000 – 6 000 000 ₽"
      repeat_offence:
        article: "ч. 9 ст. 13.11 КоАП РФ"
        official: "500 000 – 800 000 ₽"
        legal_entity: "6 000 000 – 18 000 000 ₽"
    check: hybrid
    detector: form_endpoints_geo
    evidence:
      - "URL эндпоинта отправки каждой формы"
      - "IP, ASN и страна эндпоинта"
      - "Сравнение geo статики и geo приёмника данных"
    status_logic:
      FAIL: "Форма отправляет персональные данные напрямую на иностранный эндпоинт"
      WARN: "Эндпоинт российский, но в цепочке есть иностранные посредники"
      PASS: "Все приёмники данных находятся в РФ"
    fix_hint: >-
      Первичную запись данных вести в БД на территории РФ; зарубежные сервисы
      подключать только как получателей копии после первичной записи.
    manual_check: >-
      Уточнить у владельца, в какой базе происходит первичная запись
      персональных данных и где она физически размещена. Сетевой лог показывает
      получателя запроса, но не место первичной записи.
    severity: critical
    note: >-
      Критерий не «российский хостинг» сам по себе: сайт может стоять за
      рубежом, если персональные данные первично записываются в БД в РФ.
    verified_at: "2026-09-14"

  - id: PDN-012
    group: pdn
    title: Соответствие политики фактически обрабатываемым данным
    requirement: >-
      Заявленные в политике категории персональных данных, цели и получатели
      должны соответствовать тому, что сайт собирает и куда передаёт фактически.
    norm:
      act: "ст. 5 и ч. 2 ст. 18.1 ФЗ-152"
    liability:
      article: "ч. 1 и ч. 3 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "150 000 – 300 000 ₽"
    check: llm
    evidence:
      - "Перечень полей всех форм из артефактов сбора"
      - "Перечень обнаруженных трекеров и cookie"
      - "Цитаты из политики по каждому расхождению"
    status_logic:
      PASS: "Расхождений не обнаружено"
      FAIL: "Найдено расхождение: собираются данные или задействованы получатели, не описанные в политике"
    fix_hint: "Привести политику в соответствие фактической обработке либо убрать лишний сбор."
    manual_check: >-
      Сравнить политику с фактически собираемыми полями форм и со списком
      доменов в сетевом логе: всё, что собирается и кому передаётся, должно быть
      описано в политике.
    severity: high
    note: >-
      Самая результативная проверка скилла: типовая ошибка — политика, взятая
      из шаблона и не описывающая реальные формы и трекеры.
    verified_at: "2026-09-14"

  - id: PDN-013
    group: pdn
    title: Правовое основание обработки и соответствие целям сбора
    requirement: >-
      Обработка должна вестись на законном основании и ограничиваться целями,
      заявленными при сборе. Объём собираемых данных должен быть избыточным.
    norm:
      act: "ст. 5 и ст. 6 ФЗ-152"
    liability:
      article: "ч. 1 ст. 13.11 КоАП РФ"
      fines:
        citizen: "10 000 – 15 000 ₽"
        official: "50 000 – 100 000 ₽"
        legal_entity: "150 000 – 300 000 ₽"
      repeat_offence:
        article: "ч. 1.1 ст. 13.11 КоАП РФ"
        legal_entity: "300 000 – 500 000 ₽"
    check: llm
    evidence:
      - "Сопоставление полей формы с заявленной целью её отправки"
    status_logic:
      PASS: "Избыточного сбора не обнаружено"
      FAIL: "Форма собирает данные, не нужные для заявленной цели (например, дата рождения в форме обратного звонка)"
    manual_check: >-
      Для каждой цели сбора определить правовое основание (согласие, договор,
      закон) и проверить, что состав собираемых данных не шире цели.
    severity: medium
    verified_at: "2026-09-14"

# --- ГРУППА D. Cookie и трекеры ----------------------------------------------
# Отдельного «закона о cookie» в РФ нет. Регулирование идёт через 152-ФЗ:
# cookie с идентификатором пользователя квалифицируются как персональные данные.

  - id: CK-001
    group: cookie
    title: Баннер согласия на использование cookie
    requirement: >-
      При использовании аналитических и рекламных cookie требуется согласие
      субъекта. Баннер — стандартный способ его получить и зафиксировать.
      Технические cookie (сессия, CSRF) согласия не требуют, но должны быть
      описаны в политике.
    norm:
      act: "ст. 6 и ст. 9 ФЗ-152"
    liability:
      article: "ч. 1 или ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "до 700 000 ₽"
    check: script
    detector: cookie_banner
    evidence:
      - "Селектор и текст элемента баннера"
    status_logic:
      PASS: "Баннер обнаружен"
      FAIL: "Баннер отсутствует при наличии аналитических или рекламных cookie"
      NA:   "Используются только технические cookie"
    severity: medium
    verified_at: "2026-09-14"

  - id: CK-002
    group: cookie
    title: Возможность отказаться от необязательных cookie
    requirement: >-
      Баннер только с кнопкой «Принять» не даёт субъекту выбора и не образует
      свободно данного согласия.
    norm:
      act: "ч. 1 ст. 9 ФЗ-152"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "300 000 – 700 000 ₽"
    check: script
    detector: cookie_banner
    evidence:
      - "Перечень кнопок баннера и их текст"
    status_logic:
      PASS: "Есть кнопка отказа или выбора категорий"
      FAIL: "Есть только кнопка принятия или закрытия"
      NA:   "Баннера нет"
    severity: medium
    verified_at: "2026-09-14"

  - id: CK-003
    group: cookie
    title: Трекеры не загружаются до получения согласия
    requirement: >-
      Согласие, полученное после начала обработки, юридической силы не имеет.
      Аналитические и рекламные скрипты должны подключаться только после
      подтверждения выбора пользователем.
    norm:
      act: "п. 1 ч. 1 ст. 6 ФЗ-152"
    liability:
      article: "ч. 1 или ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "до 700 000 ₽"
    check: script
    detector: consent_gating
    evidence:
      - "Диф HAR: список сторонних доменов, запрошенных до взаимодействия с баннером"
      - "Список cookie, установленных до согласия"
    status_logic:
      FAIL: "Хотя бы один аналитический или рекламный трекер загружен до согласия"
      PASS: "До согласия загружаются только технически необходимые ресурсы"
      NA:   "Баннера нет — проверка неприменима, нарушение фиксируется правилом CK-001"
    fix_hint: >-
      Перевести подключение трекеров на условную загрузку после клика; в GTM
      использовать режим согласия, а не безусловный контейнер.
    severity: high
    note: >-
      Ключевая техническая проверка группы: реализуется двумя проходами
      краулера — до и после клика по баннеру.
    verified_at: "2026-09-14"

  - id: CK-004
    group: cookie
    title: Инвентарь cookie описан в политике
    requirement: >-
      Политика должна описывать используемые cookie: типы, назначение, имена,
      сроки хранения, сторонних получателей.
    norm:
      act: "п. 1 ст. 3 и ч. 2 ст. 18.1 ФЗ-152"
    liability:
      article: "ч. 3 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "30 000 – 60 000 ₽"
    check: hybrid
    detector: cookie_inventory
    evidence:
      - "Фактический список cookie из document.cookie и заголовков Set-Cookie"
      - "Список cookie, заявленный в политике"
      - "Разница между списками"
    status_logic:
      PASS: "Все фактические cookie описаны"
      FAIL: "Найдены cookie, не описанные в политике"
    manual_check: >-
      Открыть сайт в браузере, DevTools → Application → Cookies, выписать имена
      и сроки, сравнить с перечнем в политике или cookie-политике.
    severity: low
    verified_at: "2026-09-14"

  - id: CK-005
    group: cookie
    title: Иностранные аналитические и рекламные трекеры
    requirement: >-
      Google Analytics, Google Tag Manager, Meta Pixel, Hotjar, Microsoft Clarity,
      TikTok Pixel, LinkedIn Insight передают данные в юрисдикции, не входящие в
      перечень стран с адекватной защитой, и пишут их напрямую в зарубежные БД.
      Прямого запрета нет, но легализация практически недостижима.
    norm:
      act: "ст. 12 и ч. 5 ст. 18 ФЗ-152"
    liability:
      article: "ч. 1, ч. 2 и ч. 8 ст. 13.11 КоАП РФ совокупно"
      fines:
        legal_entity: "до 6 000 000 ₽, при повторе до 18 000 000 ₽"
      extra: "дополнительно — риск запрета передачи по решению Роскомнадзора"
    check: script
    detector: trackers_jurisdiction
    signature_set: trackers.foreign
    evidence:
      - "Домены запросов из HAR с указанием страны оператора"
      - "Объём и состав передаваемых параметров, если читаются из query"
    status_logic:
      FAIL: "Обнаружен иностранный аналитический или рекламный трекер"
      PASS: "Иностранных трекеров не обнаружено"
    fix_hint: >-
      Заменить на Яндекс.Метрику, VK Pixel, Top.Mail.Ru или self-hosted Matomo.
      Российские аналоги также требуют описания в политике и согласия.
    severity: critical
    cross_ref: ["PDN-009", "PDN-011"]
    note: >-
      Публичные списки трекеров (EasyPrivacy, Tracker Radar) для этой задачи
      применимы только как источник сигнатур: они классифицируют «реклама или
      нет», а нужна классификация «юрисдикция получателя». Маппинг домен → страна
      оператора ведётся вручную в signatures.yaml.
    verified_at: "2026-09-14"

  - id: CK-006
    group: cookie
    title: Иностранные CDN, шрифты и капчи
    requirement: >-
      Подключение стороннего ресурса раскрывает его владельцу IP-адрес и
      User-Agent посетителя. Для CDN, веб-шрифтов и капч это второстепенный, но
      не нулевой риск по ст. 12 ФЗ-152.
    norm:
      act: "ст. 12 ФЗ-152"
    liability:
      article: "ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "оценивается в совокупности с CK-005"
    check: script
    detector: trackers_jurisdiction
    signature_set: trackers.foreign_infra
    evidence:
      - "Домены: fonts.googleapis.com, fonts.gstatic.com, cdnjs.cloudflare.com, unpkg.com, www.google.com/recaptcha"
    status_logic:
      WARN: "Обнаружены иностранные инфраструктурные подключения"
      PASS: "Не обнаружено"
    fix_hint: >-
      Разместить шрифты и библиотеки локально; reCAPTCHA заменить на Yandex
      SmartCaptcha. Риск ниже, чем у трекеров, но устраняется дёшево.
    severity: low
    verified_at: "2026-09-14"

  - id: CK-007
    group: cookie
    title: Тёмные паттерны в баннере согласия
    requirement: >-
      Кнопки принятия и отказа должны быть визуально равнозначны, категории
      cookie не должны быть предвыбраны, отказ не должен требовать больше
      действий, чем согласие.
    norm:
      act: "ч. 1 ст. 9 ФЗ-152 (свобода воли субъекта)"
    liability:
      article: "ч. 2 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "300 000 – 700 000 ₽"
    check: llm
    evidence:
      - "Скриншот баннера"
      - "Вычисленные стили кнопок: контраст, размер, цвет"
      - "Число кликов до отказа против числа кликов до согласия"
    status_logic:
      FAIL: "Обнаружено визуальное или структурное неравенство вариантов"
      PASS: "Варианты равнозначны"
      NA:   "Баннера нет"
    manual_check: >-
      Посмотреть баннер согласия: равнозначны ли «принять» и «отклонить» по
      размеру, контрасту и числу кликов; не спрятан ли отказ в настройках.
    severity: low
    verified_at: "2026-09-14"

# --- ГРУППА E. Инфраструктура ------------------------------------------------

  - id: INF-001
    group: infra
    title: HTTPS и принудительный редирект с HTTP
    requirement: >-
      Передача персональных данных по незащищённому каналу нарушает требования
      к мерам защиты.
    norm:
      act: "ст. 19 ФЗ-152"
    liability:
      article: "ч. 1 ст. 13.11 КоАП РФ"
      fines:
        legal_entity: "150 000 – 300 000 ₽"
    check: script
    detector: infrastructure
    evidence:
      - "Цепочка редиректов с http:// на https://"
      - "Версия TLS, срок действия сертификата, наличие mixed content"
    status_logic:
      PASS: "HTTPS обязателен, редирект настроен, mixed content отсутствует"
      FAIL: "HTTP доступен без редиректа либо формы отправляются по HTTP"
    severity: medium
    verified_at: "2026-09-14"

  - id: INF-002
    group: infra
    title: Хостинг-провайдер в реестре Роскомнадзора
    requirement: >-
      С 01.02.2024 оказывать услуги хостинга в РФ вправе только провайдеры из
      реестра Роскомнадзора.
    norm:
      act: "ст. 10.2-2 ФЗ-149 (введена ФЗ от 31.07.2023 № 406-ФЗ)"
    liability:
      article: "прямой ответственности владельца сайта нет"
      risk: "отключение услуги, блокировка ресурса, невозможность исполнить требование локализации"
    check: script
    detector: infrastructure
    registry: rkn_hosting_providers
    evidence:
      - "A и AAAA записи, ASN, whois организации"
      - "Результат сверки с реестром аккредитованных провайдеров"
    status_logic:
      PASS: "Провайдер найден в реестре"
      WARN: "Провайдер в реестре не найден либо хостинг иностранный"
      UNKNOWN: "Реестр недоступен"
    severity: low
    cross_ref: ["PDN-011"]
    verified_at: "2026-09-14"

  - id: INF-003
    group: infra
    title: География приёмников данных
    requirement: >-
      Расположение серверов, принимающих данные форм, определяет применимость
      требования локализации и трансграничной передачи.
    norm:
      act: "ч. 5 ст. 18 и ст. 12 ФЗ-152"
    check: script
    detector: form_endpoints_geo
    evidence:
      - "Таблица: эндпоинт, IP, ASN, страна"
    status_logic:
      PASS: "Все приёмники в РФ"
      FAIL: "Есть приёмники за пределами РФ"
    severity: info
    cross_ref: ["PDN-009", "PDN-011"]
    verified_at: "2026-09-14"

  - id: INF-004
    group: infra
    title: Домен или IP в реестре запрещённой информации
    requirement: >-
      Наличие ресурса или связанного с ним IP в реестре блокировок означает
      ограничение доступа и запрет размещения на нём рекламы.
    norm:
      act: "ст. 15.1 ФЗ-149"
    check: script
    detector: infrastructure
    registry: rkn_blocklist
    evidence:
      - "Совпадение домена или IP с записью реестра"
    status_logic:
      FAIL: "Совпадение найдено"
      PASS: "Совпадений нет"
      UNKNOWN: "Дамп реестра недоступен"
    manual_check: >-
      Открыть https://eais.rkn.gov.ru/ и в форме «Реестр доменных имён…» ввести
      домен сайта, пройти проверку и повторить то же для IP-адреса из раздела
      «Инфраструктура» настоящей записки. Автоматически этот реестр не
      проверяется: машиночитаемой выгрузки, доступной без статуса оператора
      связи, не существует, а публичная форма защищена капчей.
    severity: high
    note: >-
      Автоматического источника нет. Официальная выгрузка (vigruzki.rkn.gov.ru)
      выдаётся только операторам связи с лицензией и УКЭП. Публичное зеркало
      zapret-info/z-i (19 файлов dump-NN.csv, ~230 МБ) заморожено 01.10.2025:
      положительное совпадение по нему ещё что-то значит, отсутствие — ничего.
      Публичная форма eais.rkn.gov.ru защищена капчей, обходить её скилл не
      будет. Поэтому правило штатно остаётся UNKNOWN с инструкцией. Заметка
      служебная: в отчёт заказчику она не попадает, там только инструкция.
    verified_source_at: "2026-09-18"
    verified_at: "2026-09-14"

