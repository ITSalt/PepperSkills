# Реестр правил проверки сайта на соответствие требованиям РФ.
# ЕДИНЫЙ ИСТОЧНИК ПРАВДЫ (SSOT). Из него генерируются:
#   - references/checklist.md  (человекочитаемый чек-лист)
#   - детекторы detect.py      (по полю detector)
#   - аналитическая записка и план устранения (по findings.json)
# Правила данных, а не кода: сигнатуры лежат в signatures.yaml.

version: 1

meta:
  as_of: "2026-09-14"
  jurisdiction: RU
  disclaimer: >-
    Результат проверки — техническая экспертиза, а не юридическое заключение.
    Статусы и суммы штрафов носят справочный характер; окончательную
    квалификацию даёт юрист. Нормы и размеры санкций меняются — перед
    использованием сверьте поле `verified_at` каждого правила.

# --- Справочники -------------------------------------------------------------

severity_levels:
  critical: "Оборотные или многомиллионные штрафы, риск блокировки ресурса"
  high:     "Штраф юрлицу от 300 тыс. ₽, высокая вероятность выявления"
  medium:   "Штраф юрлицу до 300 тыс. ₽"
  low:      "Штраф до 50 тыс. ₽ либо предписание"
  info:     "Не нарушение; фиксируется для контекста и снижения ложных срабатываний"

check_types:
  script: "Полностью детерминированная проверка, вывод только из артефактов сбора"
  llm:    "Смысловой анализ текста или квалификация; обязательна цитата-доказательство"
  hybrid: "Скрипт находит кандидатов, LLM подтверждает или отсеивает"

statuses:
  PASS:    "Требование выполнено, есть доказательство"
  FAIL:    "Требование нарушено, есть доказательство"
  WARN:    "Признаки нарушения есть, но квалификация требует данных вне периметра проверки"
  NA:      "Требование к данному сайту не применяется"
  UNKNOWN: "Проверить не удалось (страница недоступна, реестр не загрузился, нет рендера)"

# --- ГРУППА A. Авторизация пользователей ------------------------------------
# Материальная норма: п. 10 ст. 8 ФЗ-149 (введён ФЗ от 31.07.2023 № 406-ФЗ,
# в силе с 01.12.2023). Ответственность: ст. 13.55 КоАП (введена ФЗ
# от 26.06.2026 № 199-ФЗ, в силе с 07.07.2026). Повторность не предусмотрена.
# ВНИМАНИЕ: ФЗ от 24.06.2025 № 156-ФЗ (сервис МАХ) к авторизации отношения
# не имеет — распространённая ошибка в публикациях.

rules:

  - id: AUTH-001
    group: auth
    title: Авторизация через иностранные OAuth-провайдеры
    requirement: >-
      Владелец сайта — российское юрлицо или гражданин РФ — вправе авторизовать
      пользователей, находящихся в РФ, только четырьмя способами: номер телефона,
      ЕСИА, ЕБС, иная информационная система под российским контролем (>50%).
      Google, Apple, Facebook, GitHub, Microsoft, LinkedIn, Discord, X в перечень
      не входят.
    norm:
      act: "п. 10 ст. 8 ФЗ от 27.07.2006 № 149-ФЗ"
      introduced_by: "ФЗ от 31.07.2023 № 406-ФЗ"
      in_force: "2023-12-01"
    liability:
      article: "ст. 13.55 КоАП РФ"
      in_force: "2026-07-07"
      authority: "Роскомнадзор (ч. 1 ст. 23.44 КоАП)"
      fines:
        citizen: "10 000 – 20 000 ₽"
        official: "30 000 – 50 000 ₽"
        entrepreneur: "30 000 – 50 000 ₽ (как должностное лицо, прим. к ст. 2.4 КоАП)"
        legal_entity: "500 000 – 700 000 ₽"
      repeat_offence: none
    check: script
    detector: auth_providers
    signature_set: auth.foreign_oauth
    evidence:
      - "URL сетевого запроса к домену провайдера из HAR"
      - "Селектор и текст кнопки входа"
      - "Файл и строка исходника при white-box режиме"
    status_logic:
      FAIL: "Найден маркер иностранного OAuth-провайдера на странице с формой входа или регистрации"
      WARN: "Маркер найден вне контекста авторизации (например, только в бандле, без видимой кнопки)"
      NA:   "На сайте нет авторизации: весь контент доступен без входа"
      PASS: "Авторизация есть, иностранных провайдеров не обнаружено"
    fix_hint: >-
      Удалить кнопку и SDK провайдера, перевести вход на номер телефона, ЕСИА
      или российскую ИС. Существующие аккаунты удалять не требуется — закон
      обратной силы не имеет.
    manual_check: >-
      Открыть страницу входа и перечислить кнопки авторизации: Google, Apple,
      Facebook, Microsoft, GitHub среди них быть не должно.
    severity: high
    sources:
      - "https://www.consultant.ru/document/cons_doc_LAW_61798/78b773a28f3ad19eb234697b20ab1d48c09f748a/"
      - "https://www.consultant.ru/document/cons_doc_LAW_537878/"
      - "https://www.garant.ru/article/2136195/"
    verified_at: "2026-09-14"

  - id: AUTH-002
    group: auth
    title: Авторизация через Telegram
    requirement: >-
      Telegram Login Widget передаёт функцию авторизации иностранному мессенджеру.
      Привязка аккаунта к российскому номеру сути не меняет.
    norm:
      act: "п. 10 ст. 8 ФЗ-149"
      in_force: "2023-12-01"
    liability:
      article: "ст. 13.55 КоАП РФ"
      in_force: "2026-07-07"
      fines:
        legal_entity: "500 000 – 700 000 ₽"
    check: script
    detector: auth_providers
    signature_set: auth.telegram
    evidence:
      - "Подключение telegram.org/js/telegram-widget.js"
      - "Атрибут data-telegram-login или обработчик onTelegramAuth"
      - "Запрос к oauth.telegram.org в HAR"
    status_logic:
      FAIL: "Найден виджет Telegram Login"
      WARN: "Найдены только вызовы api.telegram.org/bot — это уведомления, не авторизация; требуется подтверждение LLM"
      PASS: "Виджет не обнаружен"
    fix_hint: >-
      Убрать виджет. Telegram как канал уведомлений и ботов остаётся законным —
      запрет касается только функции входа.
    manual_check: >-
      Открыть страницу входа и посмотреть, есть ли кнопка «Войти через Telegram»
      (виджет Telegram Login). Бот и ссылка на канал нарушением не являются.
    severity: high
    note: >-
      Позиция регуляторов прямо не выражена, юристы квалифицируют как зону
      повышенного риска. Запросы к oauth.telegram.org из РФ фактически
      блокируются на уровне DPI — виджет всё равно не работает.
    sources:
      - "https://www.garant.ru/article/2136195/"
    verified_at: "2026-09-14"

  - id: AUTH-003
    group: auth
    title: Иностранные сервисы идентификации (IDaaS/BaaS)
    requirement: >-
      Firebase Authentication, Auth0, Clerk, AWS Cognito, Okta, Stytch, Magic,
      Supabase Auth с внешними провайдерами — информационные системы, владельцы
      которых иностранные лица. Под пп. 4 п. 10 ст. 8 ФЗ-149 не подпадают.
    norm:
      act: "пп. 4 п. 10 ст. 8 ФЗ-149"
      in_force: "2023-12-01"
    liability:
      article: "ст. 13.55 КоАП РФ"
      in_force: "2026-07-07"
      fines:
        legal_entity: "500 000 – 700 000 ₽"
    check: script
    detector: auth_providers
    signature_set: auth.foreign_idaas
    evidence:
      - "Запросы к identitytoolkit.googleapis.com, *.auth0.com, clerk.*, cognito-idp.*.amazonaws.com"
      - "Импорты firebase/auth, @auth0/auth0-spa-js, @clerk/clerk-js в бандле"
    status_logic:
      FAIL: "Обнаружен иностранный IDaaS, используемый для входа пользователей"
      WARN: "SDK присутствует, но признаков использования для авторизации не найдено (например, Firebase только для аналитики или хранилища)"
      PASS: "Не обнаружено"
    fix_hint: >-
      Перенести аутентификацию на собственный бэкенд либо на российского
      провайдера. Остальные модули Firebase/Supabase при этом могут отдельно
      нарушать требования 152-ФЗ — см. PDN-011.
    manual_check: >-
      Посмотреть в DevTools → Network, к каким доменам обращается страница
      входа: Auth0, Firebase, Okta, Cognito, Clerk, Supabase Auth — иностранные
      сервисы идентификации.
    severity: high
    note: >-
      Прямых разъяснений регулятора по IDaaS нет; вывод сделан по букве нормы
      через критерий владельца информационной системы.
    verified_at: "2026-09-14"

  - id: AUTH-004
    group: auth
    title: Наличие хотя бы одного разрешённого способа авторизации
    requirement: >-
      Если доступ к информации предоставляется только авторизованным
      пользователям, хотя бы один из четырёх разрешённых способов должен быть
      реализован.
    norm:
      act: "п. 10 ст. 8 ФЗ-149"
      in_force: "2023-12-01"
    liability:
      article: "ст. 13.55 КоАП РФ"
      fines:
        legal_entity: "500 000 – 700 000 ₽"
    check: hybrid
    detector: auth_providers
    signature_set: auth.allowed_ru
    evidence:
      - "Поле ввода телефона: input[type=tel], autocomplete=tel, маска +7"
      - "Маркеры ЕСИА: esia.gosuslugi.ru/aas/oauth2"
      - "Маркеры российских ИС: id.vk.com, oauth.yandex.ru, id.sber.ru, id.tbank.ru"
      - "Собственная форма логин/пароль (не является авторизацией через стороннюю ИС и допустима)"
    status_logic:
      PASS: "Найден хотя бы один разрешённый способ либо собственная форма входа"
      FAIL: "Авторизация есть, но все найденные способы — иностранные"
      NA:   "Авторизации на сайте нет"
    fix_hint: "Добавить вход по номеру телефона (SMS или flash-call) как основной способ."
    manual_check: >-
      Открыть страницу входа и перечислить предлагаемые способы. Хотя бы один
      должен быть разрешённым: номер телефона, Госуслуги (ЕСИА), ЕБС или
      собственная учётная запись сайта.
    severity: high
    verified_at: "2026-09-14"

  - id: AUTH-005
    group: auth
    title: Применимость требования к владельцу сайта
    requirement: >-
      Обязанность возникает при одновременном выполнении трёх условий: владелец —
      российское юрлицо (контроль РФ свыше 50%) или гражданин РФ; деятельность
      ведётся в интернете на территории РФ; доступ к информации предоставляется
      авторизованным пользователям.
    norm:
      act: "п. 10 ст. 8 ФЗ-149"
    check: llm
    evidence:
      - "Реквизиты владельца из футера или раздела контактов (см. ORG-001)"
      - "Данные ЕГРЮЛ по ИНН при доступности источника"
    status_logic:
      PASS: "Установлено, что владелец — российское лицо; требования группы auth применимы"
      NA:   "Установлено, что владелец — иностранное лицо; ст. 13.55 неприменима"
      UNKNOWN: "Реквизиты не найдены — все правила группы auth помечаются WARN"
    manual_check: >-
      Определить владельца сайта по реквизитам в футере или по выписке
      ЕГРЮЛ/ЕГРИП. Требование п. 10 ст. 8 ФЗ-149 адресовано российским лицам.
    severity: info
    note: >-
      Критерия «российский сайт» по домену или хостингу в законе нет. Термин
      «программа для ЭВМ» охватывает мобильные приложения и SaaS. Внутренние
      корпоративные системы исключения не имеют — это признанный дефект нормы.
    verified_at: "2026-09-14"

  - id: AUTH-006
    group: auth
    title: Российские провайдеры авторизации — информационный пункт
    requirement: >-
      VK ID, Яндекс ID, Сбер ID, T-ID, Mail.ru, OK легитимны по пп. 4 п. 10 ст. 8
      ФЗ-149 при соответствии требованиям ст. 16 ФЗ-149. Официального реестра
      одобренных систем не существует — соответствие оценивает владелец сайта.
    norm:
      act: "пп. 4 п. 10 ст. 8 ФЗ-149; ст. 16 ФЗ-149"
    check: script
    detector: auth_providers
    signature_set: auth.allowed_ru
    evidence:
      - "Маркеры российских провайдеров"
    status_logic:
      PASS: "Используются только российские провайдеры"
      NA:   "Российские провайдеры не используются"
    severity: info
    fix_hint: >-
      Запросить у провайдера подтверждение соответствия ст. 16 ФЗ-149 и
      зафиксировать его в договоре — это единственная доступная форма
      подтверждения при отсутствии реестра.
    verified_at: "2026-09-14"

  - id: AUTH-007
    group: auth
    title: Иностранная почта как логин — не нарушение
    requirement: >-
      Использование адреса вида user@gmail.com в качестве логина при собственной
      проверке пароля нарушением не является: закон предъявляет требования к
      владельцу сервиса авторизации, а не к формату логина.
    norm:
      act: "п. 10 ст. 8 ФЗ-149"
    check: info_only
    status_logic:
      NA: "Пункт существует для подавления ложных срабатываний детектора"
    severity: info
    note: >-
      Позиция авторов законопроекта и большинства юрфирм. Миноритарная позиция
      (К. Сальникова) считает такую авторизацию недопустимой; практический риск
      оценивается как низкий. При обнаружении e-mail-логина выдавать пояснение,
      а не нарушение.
    verified_at: "2026-09-14"

  - id: AUTH-008
    group: auth
    title: reCAPTCHA не является авторизацией
    requirement: >-
      Google reCAPTCHA и аналоги — средства антибот-защиты. Под ст. 13.55 КоАП
      не подпадают.
    check: info_only
    status_logic:
      NA: "Пункт существует для подавления ложных срабатываний детектора"
    severity: info
    cross_ref: ["CK-006"]
    note: >-
      Самостоятельный риск сохраняется по 152-ФЗ: reCAPTCHA передаёт IP и
      поведенческие данные в США. Проверяется правилом CK-006, не AUTH.
    verified_at: "2026-09-14"

# --- ГРУППА B. Дисклеймеры и символика ---------------------------------------
# Три разных правовых режима, которые на практике путают:
#   иноагенты        — плашка обязательна, форма утверждена ПП 2108;
#   экстремистские   — указание обязательно, жёсткой формы нет;
#   нежелательные    — дисклеймер НЕ обязателен, запрещено распространение материалов.

  - id: DISC-001
    group: disclaim
    title: Упоминание иностранного агента без указания на статус
    requirement: >-
      Запрещается распространение материалов иностранного агента, а также
      информации, касающейся его деятельности, без указания на то, что материал
      произведён, распространён иноагентом либо касается его деятельности.
      Обязанность лежит на любом распространителе, не только на самом иноагенте.
    norm:
      act: "ч. 7 ст. 10 ФЗ-149; ч. 3 и ч. 4 ст. 9 ФЗ от 14.07.2022 № 255-ФЗ"
      form: "ПП РФ от 22.11.2022 № 2108 (ред. ПП РФ от 16.08.2025 № 1232), действует до 01.12.2028"
    liability:
      article: "ч. 4 ст. 19.34 КоАП РФ"
      fines:
        citizen: "30 000 – 50 000 ₽"
        official: "100 000 – 300 000 ₽"
        legal_entity: "300 000 – 500 000 ₽"
      extra: "с конфискацией предмета правонарушения или без таковой"
      also:
        - "ч. 2.1 ст. 13.15 КоАП (для СМИ и их материалов в сетях): 2 000 / 4 000–5 000 / 40 000–50 000 ₽"
        - "ч. 42 ст. 19.5 КоАП (неисполнение предписания Минюста): до 300 000 ₽ для юрлиц"
    check: hybrid
    detector: registry_mentions
    registry: minjust_foreign_agents
    evidence:
      - "Совпадение ФИО или наименования из реестра в тексте страницы с указанием URL и фрагмента"
      - "Наличие или отсутствие плашки в пределах того же материала"
    status_logic:
      FAIL: "Упоминание найдено, плашки в материале нет"
      WARN: "Найдено совпадение по фамилии без инициалов либо в составе другого имени — требуется подтверждение LLM"
      PASS: "Упоминаний нет либо все сопровождаются плашкой"
      UNKNOWN: "Реестр не загрузился и снапшот устарел"
    fix_hint: >-
      Добавить плашку по форме № 1 ПП 2108 в начало каждого материала под
      заголовком. Наименование брать строго как в реестре.
    manual_check: >-
      Повторить прогон, когда реестр доступен: `python3 scripts/registries.py
      update`, при необходимости через российский прокси
      (`PEPPER_RU_REGISTRY_PROXY`), либо выгрузить реестр вручную и подать через
      `registries.py import`.
    severity: high
    note: >-
      Практика для не-СМИ: Минюст выносит предупреждение с двухмесячным сроком на
      устранение, при неустранении — суд по ч. 42 ст. 19.5 КоАП. Реестр
      физлиц, аффилированных с иноагентами, не публикуется, и маркировать их
      упоминание не требуется (ч. 2 ст. 6 ФЗ-255).
    sources:
      - "https://base.garant.ru/12148555/3d3a9e2eb4f30c73ea6671464e2a54b5/"
      - "https://base.garant.ru/405762057/"
    verified_at: "2026-09-14"

  - id: DISC-002
    group: disclaim
    title: Соответствие плашки иноагента утверждённой форме
    requirement: >-
      Плашка размещается на русском языке, шрифтом вдвое крупнее основного текста,
      контрастным цветом, в начале материала под заголовком, без наложения на текст
      или изображение. В видео — по центру кадра, не менее 20% площади, не менее
      15 секунд, в начале трансляции и при каждом возобновлении.
    norm:
      act: "п. 4–14 Правил, утв. ПП РФ от 22.11.2022 № 2108"
    liability:
      article: "ч. 4 ст. 19.34 КоАП РФ"
      in_force: "2025-09-01"
      fines:
        legal_entity: "300 000 – 500 000 ₽"
      note: "Слова о несоответствии утверждённой форме добавлены ФЗ от 24.06.2025 № 171-ФЗ — с 01.09.2025 неверная плашка является самостоятельным нарушением"
    check: hybrid
    detector: registry_mentions
    evidence:
      - "Текст плашки и её позиция в DOM относительно заголовка и тела материала"
      - "Вычисленный font-size плашки и основного текста"
      - "Вычисленный контраст цвета к фону"
    status_logic:
      FAIL: "Плашка есть, но нарушено любое из требований к форме"
      WARN: "Плашка оформлена сноской со звёздочкой в конце материала — формально не соответствует форме"
      PASS: "Плашка соответствует требованиям"
